<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reconocimiento de Cartas Yu-Gi-Oh!</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600&display=swap" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(120deg, #232526, #414345);
            color: #fff;
            font-family: 'Montserrat', Arial, sans-serif;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            max-width: 480px;
            margin: 40px auto;
            background: rgba(30, 30, 40, 0.97);
            border-radius: 18px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            padding: 32px 24px 24px 24px;
            text-align: center;
        }
        h1 {
            font-size: 2.1rem;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }
        .subtitle {
            color: #bdbdbd;
            font-size: 1rem;
            margin-bottom: 24px;
        }
        .upload-box {
            background: #22242a;
            border: 2px dashed #888;
            border-radius: 12px;
            padding: 24px 0;
            margin-bottom: 18px;
            cursor: pointer;
            transition: border 0.2s;
        }
        .upload-box.dragover {
            border-color: #00e1ff;
        }
        input[type="file"] {
            display: none;
        }
        .btn {
            background: #00e1ff;
            color: #232526;
            border: none;
            border-radius: 8px;
            padding: 12px 32px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s;
        }
        .btn:hover {
            background: #00bcd4;
        }
        .preview {
            margin: 18px 0 10px 0;
        }
        .preview img {
            max-width: 180px;
            border-radius: 10px;
            box-shadow: 0 2px 12px #0008;
        }
        .result {
            margin-top: 24px;
            background: #23242b;
            border-radius: 10px;
            padding: 18px 10px;
        }
        .result h2 {
            margin: 0 0 10px 0;
            font-size: 1.2rem;
        }
        .card-img {
            max-width: 120px;
            border-radius: 8px;
            box-shadow: 0 2px 8px #0006;
        }
        .similar-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-top: 10px;
        }
        .similar-item {
            background: #23242b;
            border-radius: 8px;
            padding: 8px 6px;
            text-align: center;
            width: 90px;
        }
        .similar-item img {
            max-width: 60px;
            border-radius: 5px;
        }
        .error {
            color: #ff5252;
            margin-top: 10px;
        }
        .loader {
            border: 4px solid #232526;
            border-top: 4px solid #00e1ff;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            animation: spin 1s linear infinite;
            margin: 18px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Reconocimiento de Cartas Yu-Gi-Oh!</h1>
        <div class="subtitle">Sube una foto o imagen de una carta y el sistema la identificará automáticamente.</div>
        <form id="upload-form">
            <label class="upload-box" id="upload-box">
                <span id="upload-text">Haz clic o arrastra una imagen aquí</span>
                <input type="file" id="file-input" accept="image/*">
            </label>
            <div class="preview" id="preview"></div>
            <button type="submit" class="btn">Buscar carta</button>
        </form>
        <div id="loader" class="loader" style="display:none;"></div>
        <div id="result" class="result" style="display:none;"></div>
        <div id="error" class="error"></div>
    </div>
    <script>
        const uploadBox = document.getElementById('upload-box');
        const fileInput = document.getElementById('file-input');
        const preview = document.getElementById('preview');
        const form = document.getElementById('upload-form');
        const loader = document.getElementById('loader');
        const resultDiv = document.getElementById('result');
        const errorDiv = document.getElementById('error');
        let selectedFile = null;

        uploadBox.addEventListener('click', () => fileInput.click());
        uploadBox.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadBox.classList.add('dragover');
        });
        uploadBox.addEventListener('dragleave', () => uploadBox.classList.remove('dragover'));
        uploadBox.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadBox.classList.remove('dragover');
            if (e.dataTransfer.files.length > 0) {
                fileInput.files = e.dataTransfer.files;
                showPreview();
            }
        });
        fileInput.addEventListener('change', showPreview);

        function showPreview() {
            preview.innerHTML = '';
            errorDiv.textContent = '';
            if (fileInput.files && fileInput.files[0]) {
                selectedFile = fileInput.files[0];
                const reader = new FileReader();
                reader.onload = (e) => {
                    preview.innerHTML = `<img src="${e.target.result}" alt="preview">`;
                };
                reader.readAsDataURL(selectedFile);
            } else {
                selectedFile = null;
            }
        }

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            errorDiv.textContent = '';
            resultDiv.style.display = 'none';
            resultDiv.innerHTML = '';
            if (!selectedFile) {
                errorDiv.textContent = 'Por favor selecciona una imagen.';
                return;
            }
            loader.style.display = 'block';
            const formData = new FormData();
            formData.append('file', selectedFile);
            fetch('/upload', {
                method: 'POST',
                body: formData
            })
            .then(res => res.json())
            .then(data => {
                loader.style.display = 'none';
                if (data.error) {
                    errorDiv.textContent = data.error;
                    return;
                }
                showResult(data);
            })
            .catch(err => {
                loader.style.display = 'none';
                errorDiv.textContent = 'Error procesando la imagen.';
            });
        });

        function showResult(data) {
            resultDiv.style.display = 'block';
            if (!data.best_match) {
                resultDiv.innerHTML = '<h2>No se encontró ninguna carta similar.</h2>';
                return;
            }
            let html = '';
            if (data.found_card) {
                html += `<h2>¡Carta encontrada!</h2>`;
                html += `<img class="card-img" src="/card/${data.best_match.card_id}" alt="Carta encontrada"><br>`;
                html += `<div><b>ID:</b> ${data.best_match.card_id}</div>`;
                html += `<div><b>Similitud:</b> ${(data.best_match.similarity*100).toFixed(1)}%</div>`;
            } else {
                html += `<h2>No se encontró la carta exacta</h2>`;
                html += `<div>La carta más similar encontrada es:</div>`;
                html += `<img class="card-img" src="/card/${data.best_match.card_id}" alt="Carta más similar"><br>`;
                html += `<div><b>ID:</b> ${data.best_match.card_id}</div>`;
                html += `<div><b>Similitud:</b> ${(data.best_match.similarity*100).toFixed(1)}%</div>`;
            }
            if (data.top_results && data.top_results.length > 1) {
                html += `<div style="margin-top:12px;">Otras cartas similares:</div><div class="similar-list">`;
                data.top_results.slice(1).forEach(card => {
                    html += `<div class="similar-item">
                        <img src="/card/${card.card_id}" alt="${card.card_id}"><br>
                        <span style="font-size:0.9em;">${card.card_id}</span><br>
                        <span style="font-size:0.8em;">${(card.similarity*100).toFixed(1)}%</span>
                    </div>`;
                });
                html += '</div>';
            }
            html += `<div style="margin-top:10px;font-size:0.9em;color:#bdbdbd;">Tiempo de búsqueda: ${data.processing_time.toFixed(2)}s</div>`;
            resultDiv.innerHTML = html;
        }
    </script>
</body>
</html>
